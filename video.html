<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Sharing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2 class="text-center">Screen Sharing with WebSocket</h2>
    <div class="text-center mt-4">
        <button id="startShare" class="btn btn-primary">Start Screen Share</button>
        <button id="stopShare" class="btn btn-danger" disabled>Stop Screen Share</button>
    </div>
    <script>
        let mediaStream;
        let ws;

        document.getElementById("startShare").addEventListener("click", async () => {
            try {
                mediaStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const videoTrack = mediaStream.getVideoTracks()[0];
                let token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlcyI6WyJVU0VSIl0sInVzZXJfaWQiOjEsImV4cCI6MTc0MzI1Nzk0NiwiaWF0IjoxNzQzMTcxNTQ2fQ.6JPKCfjtLP-eRGXOU_qZbJBl2JBMJN-tSnGpMoZ5okA"; 
                let userId='1';
                ws = new WebSocket(`ws://127.0.0.1:8000/ws/stream/start/live/${userId}/?token=${encodeURIComponent(token)}`); // Update with your WebSocket server URL
                
                ws.onopen = () => {
                    console.log("WebSocket connected");
                    const mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm' });
                    
                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0 && ws.readyState === WebSocket.OPEN) {
                            ws.send(event.data);
                        }
                    };
                    
                    mediaRecorder.start(1000);
                    document.getElementById("startShare").disabled = true;
                    document.getElementById("stopShare").disabled = false;

                    document.getElementById("stopShare").addEventListener("click", () => {
                        mediaRecorder.stop();
                        videoTrack.stop();
                        ws.close();
                        document.getElementById("startShare").disabled = false;
                        document.getElementById("stopShare").disabled = true;
                    });
                };

                ws.onerror = (error) => console.error("WebSocket Error: ", error);
                ws.onclose = () => console.log("WebSocket connection closed");
            } catch (error) {
                console.error("Error accessing screen share: ", error);
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
