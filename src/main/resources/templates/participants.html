
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participants Live Streaming</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/jquery.jgrowl.min.css}" rel="stylesheet">
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/jquery.min.js}"></script>
    <script th:src="@{/js/jquery.jgrowl.min.js}"></script>
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        #messages {
            border: 1px solid #ccc;
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            background: #fff;
        }
        .participant-list {
            list-style: none;
            padding: 0;
        }
        .participant-list li {
            padding: 10px;
            background: #007bff;
            color: white;
            border-radius: 5px;
            margin-bottom: 5px;
        }
        #mic-status-indicator {
            font-size: 1.2rem;
            margin-right: 10px;
            transition: color 0.3s ease;
        }

        #volume-meter {
            width: 100px;
            height: 5px;
            background: #ddd;
            margin-top: 5px;
        }

        #volume-level {
            height: 100%;
            background: #4CAF50;
            transition: width 0.1s ease;
        }
    </style>
</head>

<body>
    <div class="container">
        <h3>Live Video Stream</h3>
        <video id="screenShareVideo" autoplay playsinline style="width:60%; border: 1px solid #000;"></video>
        <br/>
        <h2 class="text-primary">Live Streaming</h2>
        <input type="text" id="wsUrl" class="form-control" placeholder="Enter WebSocket Event Link">
        <div class="d-flex gap-3">
            <button id="connect" class="btn btn-success mt-2">Join Event</button>
            <button id="leave" class="btn btn-secondary mt-2 btn-xs d-none">Leave Live</button>
        </div>
       
        <button type="button" class="btn btn-warning d-none btn-xs" id="leaveCohost" >Leave as Co-host</button>
        <h3>Participants</h3>
        <p id="participants-count" class="fw-bold">Participants: 0</p>
        <ul id="participant-list" class="participant-list"></ul>
        <!-- Add this to your participant HTML -->
        <div id="audio-controls">
            <span id="mic-status-indicator">🎤 Off</span>
            <div id="cohost-controls" class="d-none">
                <button id="leave-cohost-btn" class="btn btn-danger btn-sm">Leave as Co-host</button>
            </div>
        </div>

        <!-- Volume meter (optional) -->
        <div id="volume-meter" class="d-none">
            <div id="volume-level" style="width: 0%"></div>
        </div>
        <h3>Chat</h3>
        <div id="chat-container">
            <div id="messages"></div>
            <input type="text" id="messageInput" class="form-control mt-2" placeholder="Type a message...">
            <button onclick="sendMessage()" class="btn btn-primary mt-2">Send</button>
        </div>
    </div>
    
    <!-- Cohost Invite Modal -->
    <div class="modal fade" id="cohostInviteModal" tabindex="-1" aria-labelledby="cohostInviteLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="cohostInviteLabel">Cohost Invitation</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="cohostInviteMessage"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" id="declineCohost">Decline</button>
                    <button type="button" class="btn btn-success" id="acceptCohost">Accept</button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
