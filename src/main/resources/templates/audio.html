<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host Start Streaming</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/jquery.jgrowl.min.css}" rel="stylesheet">
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/jquery.min.js}"></script>
    <script th:src="@{/js/jquery.jgrowl.min.js}"></script>
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        #messages {
            border: 1px solid #ccc;
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            background: #fff;
        }
        .participant-list {
            list-style: none;
            padding: 0;
        }
        .participant-list li {
            padding: 10px;
            background: #007bff;
            color: white;
            border-radius: 5px;
            margin-bottom: 5px;
        }
        #cameraPreview {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 150px;
            height: 100px;
            border: 2px solid #007bff;
            border-radius: 10px;
            background: black;
            display: none;
            cursor: grab;
        }

    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-primary">Live Streaming</h2>
        <video id="cameraPreview" autoplay playsinline muted></video>
        <button id="start" class="btn btn-success">Start Streaming</button>
        <button id="stop" class="btn btn-danger" disabled>Stop Streaming</button>
        <button id="toggleStream" class="btn btn-warning" disabled>Switch to Screen Sharing</button>
        
        <h3>Participants</h3>
        <p id="participants-count" class="fw-bold">Participants: 0</p>
        <ul id="participant-list" class="participant-list"></ul>
        <div id="speaking-indicators">
            <span id="host-speaking-indicator">🎤 Host is speaking</span>
            <span id="cohost-speaking-indicator">🎤 Co-host is speaking</span>
        </div>
        <h3>Event Info</h3>
        <div id="event-info"></div>

        <h3>Chat</h3>
        <div id="chat-container">
            <div id="messages"></div>
            <input type="text" id="messageInput" class="form-control mt-2" placeholder="Type a message...">
            <button id="sendMessageBtn" class="btn btn-primary mt-2">Send</button>
        </div>
    </div>

    <script type="module" th:src="@{/js/host.js}"></script>
</body>
</html>
