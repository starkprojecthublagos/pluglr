<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Audio Streaming (Host)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #startStream {
            margin-top: 20px;
        }
        #stopStream {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Start Your Live Audio Stream</h1>

    <!-- Stream Control -->
    <button id="startStream">Start Stream</button>
    <button id="stopStream">Stop Stream</button>
  <script>
    let socket;
    let localStream;
    let eventId;
    let peerConnection;
    const peerConnections = new Map();
    const iceServers = [
        { urls: "stun:stun.relay.metered.ca:80" },
        { 
            urls: "turn:global.relay.metered.ca:80",
            username: "f41e6ed59c9fead32c5f40e8",
            credential: "nrjse7jNfXAMi0Rs"
        },
        { 
            urls: "turn:global.relay.metered.ca:80?transport=tcp",
            username: "f41e6ed59c9fead32c5f40e8",
            credential: "nrjse7jNfXAMi0Rs"
        },
        { 
            urls: "turn:global.relay.metered.ca:443",
            username: "f41e6ed59c9fead32c5f40e8",
            credential: "nrjse7jNfXAMi0Rs"
        },
        { 
            urls: "turns:global.relay.metered.ca:443?transport=tcp",
            username: "f41e6ed59c9fead32c5f40e8",
            credential: "nrjse7jNfXAMi0Rs"
        }
    ];

    // Buttons
    const startStreamButton = document.getElementById("startStream");
    const stopStreamButton = document.getElementById("stopStream");

    // WebSocket connection
    socket = new WebSocket("wss://apps.pluglr.com/ws/stream/start/live/host_event_id");

    socket.onopen = () => {
        console.log("WebSocket connected!");
        socket.send(JSON.stringify({
            type: "host_ready",
            role: "host",
            room_id: "host_event_id" 
        }));
    };

    socket.onmessage = async (event) => {
        const data = JSON.parse(event.data);
        
        if (data.type === "host_room_created") {
            eventId = data.room_id;
            console.log("Room ID:", eventId);
        }

        if (data.type === "viewer_joined") {
            const viewerId = data.viewer_id;
            await createConnectionForViewer(viewerId);
        }

        if (data.type === "stream_answer") {
            const viewerId = data.viewer_id;
            const pc = peerConnections.get(viewerId);
            if (pc) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
        }

        if (data.type === "ice_candidate") {
            const viewerId = data.viewer_id;
            const pc = peerConnections.get(viewerId);
            if (pc && data.candidate) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        }
    };

    // Start Stream Button Click
    startStreamButton.addEventListener("click", async () => {
        await startAudioStream();
        startStreamButton.disabled = true;
        stopStreamButton.disabled = false;
    });

    // Stop Stream Button Click
    stopStreamButton.addEventListener("click", () => {
        stopAudioStream();
    });

    async function startAudioStream() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });

            peerConnection = new RTCPeerConnection({
                iceServers: iceServers,
                iceTransportPolicy: 'all',
                bundlePolicy: 'max-bundle',
                rtcpMuxPolicy: 'require'
            });

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.send(JSON.stringify({
                        type: "ice_candidate",
                        candidate: event.candidate
                    }));
                }
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            socket.send(JSON.stringify({
                type: "stream_offer",
                offer: offer
            }));
            console.log("SDP offer sent to backend");

        } catch (error) {
            console.error("Error starting audio stream:", error);
        }
    }

    function stopAudioStream() {
        if (peerConnection) peerConnection.close();
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        startStreamButton.disabled = false;
        stopStreamButton.disabled = true;
        console.log("Stream stopped");
    }

    async function createConnectionForViewer(viewerId) {
        console.log("Creating connection for viewer:", viewerId);
        
        if (!localStream) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (err) {
                console.error("Failed to get local stream", err);
                return;
            }
        }

        const pc = new RTCPeerConnection({
            iceServers: iceServers,
            iceTransportPolicy: 'all'
        });

        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                socket.send(JSON.stringify({
                    type: "ice_candidate",
                    viewer_id: viewerId,
                    candidate: event.candidate,
                    room_id: eventId  
                }));
            }
        };

        pc.oniceconnectionstatechange = () => {
            console.log(`ICE state for viewer ${viewerId}:`, pc.iceConnectionState);
            if (pc.iceConnectionState === 'failed') {
                console.error("ICE failed for viewer:", viewerId);
            }
        };

        try {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            socket.send(JSON.stringify({
                type: "offer",
                viewer_id: viewerId,
                room_id: eventId,
                offer: offer
            }));

            peerConnections.set(viewerId, pc);
        } catch (error) {
            console.error("Error creating offer for viewer:", viewerId, error);
        }
    }
</script>
</body>
</html>
