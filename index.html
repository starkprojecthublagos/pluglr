<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Broadcaster Test</title>
</head>
<body>
    <h2>WebRTC Broadcaster Test</h2>
    
    <label for="token">Enter Bearer Token:</label>
    <input type="text" id="token" placeholder="Bearer token" style="width: 400px;">
    <button onclick="connectWebSocket()">Start Stream</button>

    <h3>WebSocket Messages:</h3>
    <pre id="messages" style="border: 1px solid #000; padding: 10px; height: 300px; overflow-y: scroll;"></pre>

    <script>
    
    let socket;

function connectWebSocket() {
    const token = document.getElementById("token").value.trim();
    if (!token) {
        alert("Please enter a Bearer token.");
        return;
    }

    const wsUrl = `ws://localhost:8000/ws/webrtc/?token=${encodeURIComponent(token)}`;

    socket = new WebSocket(wsUrl);

    socket.onopen = () => logMessage("✅ Connected to WebSocket server.");

    socket.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);
            logMessage(`📩 Received: ${JSON.stringify(data)}`);

            if (data.type === "room_created") {
                logMessage(`🚪 Room Created! Share this room_id: ${data.room_id}`);
            } else if (data.type === "user_joined") {
                logMessage(`👤 User Joined: ${data.username}`);
            } else if (data.type === "user_left") {
                logMessage(`🚶 User Left: ${data.username}`);
            }
        } catch (error) {
            logMessage("❌ Error parsing WebSocket message.");
        }
    };

    socket.onerror = (error) => logMessage(`⚠️ WebSocket Error: ${error.message}`);

    socket.onclose = (event) => logMessage(`🔌 WebSocket closed. Code: ${event.code}`);
}

function logMessage(message) {
    const messageContainer = document.getElementById("messages");
    const logEntry = document.createElement("div");
    logEntry.textContent = message;
    messageContainer.appendChild(logEntry);
    messageContainer.scrollTop = messageContainer.scrollHeight;
}



    </script>
</body>
</html>
